site_name: 现代视觉模型
site_description: 现代视觉模型技术丛书
site_author: ""
site_url: https://shippingwang.com/book/vision/

docs_dir: docs
site_dir: site
exclude_docs: |
  *.tmp
  **/*.tmp

theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  favicon: assets/favicon.png
  logo: assets/favicon.png

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax-config.js
  - path: javascripts/vendor/tex-mml-chtml.js
    defer: true
  - path: javascripts/formula-flow.js
    defer: true

extra:
  generator: false
  homepage: https://shippingwang.com/
  social: []

copyright: ""

